<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Editor de Organogramas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra de ferramentas no topo, prancheta pontilhada à esquerda com cartões em árvore, painel de propriedades à direita (vira folha inferior no celular) */
:root{
  --paper:#eef1f4; --dot:#cdd5dd; --panel:#ffffff; --panel-2:#f6f8fa;
  --ink:#16202a; --muted:#5a6774; --rule:#d9dfe5;
  --card:#ffffff; --card-edge:#cbd4dc; --wire:#9aa8b5;
  --accent:#0e6b70; --accent-ink:#ffffff; --accent-soft:#dcefee;
  --danger:#b4232c; --danger-soft:#fbe7e8; --ok:#2e7d4f;
  --shadow:0 1px 2px rgba(22,32,42,.06),0 6px 18px rgba(22,32,42,.08);
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161b; --dot:#25303a; --panel:#182027; --panel-2:#1d262e;
  --ink:#e5ebf0; --muted:#94a2ae; --rule:#2c3741;
  --card:#1f2931; --card-edge:#34414c; --wire:#566572;
  --accent:#4fb3b5; --accent-ink:#0b1a1b; --accent-soft:#183739;
  --danger:#f0727a; --danger-soft:#3a1d20; --ok:#6cc391;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161b; --dot:#25303a; --panel:#182027; --panel-2:#1d262e;
  --ink:#e5ebf0; --muted:#94a2ae; --rule:#2c3741;
  --card:#1f2931; --card-edge:#34414c; --wire:#566572;
  --accent:#4fb3b5; --accent-ink:#0b1a1b; --accent-soft:#183739;
  --danger:#f0727a; --danger-soft:#3a1d20; --ok:#6cc391;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- barra superior ---------- */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--rule);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px}
.mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
#chartTitle{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;min-width:0;width:100%;max-width:360px}
#chartTitle:hover{border-color:var(--rule)}
#chartTitle:focus{border-color:var(--accent);outline:none;background:var(--panel-2)}
.search{position:relative;flex:0 1 240px;min-width:150px}
.search input{width:100%;border:1px solid var(--rule);background:var(--panel-2);border-radius:8px;padding:7px 10px 7px 32px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;z-index:30}
.results button{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--accent-soft)}
.results small{color:var(--muted)}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap;line-height:1.1}
.btn:hover{background:var(--panel-2);border-color:var(--card-edge)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{padding:7px}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--rule))}
.btn.danger:hover{background:var(--danger-soft)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.sep{width:1px;height:24px;background:var(--rule);margin-inline:2px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok i{background:var(--ok)} .status.busy i{background:#d29a1e} .status.err i{background:var(--danger)}
.menu-wrap{position:relative}
.tabs{flex:1 1 100%;order:10;display:flex;align-items:flex-end;gap:2px;overflow-x:auto;margin-bottom:-10px;padding-top:2px;scrollbar-width:thin}
.tab{display:inline-flex;align-items:center;gap:6px;max-width:240px;border:1px solid transparent;border-bottom:0;background:none;border-radius:8px 8px 0 0;padding:8px 14px 9px;cursor:pointer;color:var(--muted);white-space:nowrap;flex:none;position:relative}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab:hover{background:var(--panel-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--paper);border-color:var(--rule);color:var(--ink);font-weight:600}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;top:-1px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab.add{color:var(--accent);font-weight:600}
.tab.add svg{width:16px;height:16px}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:250px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:40;display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--accent-soft)}
.menu hr{border:0;border-top:1px solid var(--rule);margin:4px 2px}
.menu .del{color:var(--danger)}

/* ---------- área principal ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0}
.stage{position:relative;overflow:hidden;min-width:0;touch-action:none;user-select:none;-webkit-user-select:none}
#chart{display:block;width:100%;height:100%;cursor:grab}
#chart.panning{cursor:grabbing}
.card{cursor:pointer}
.card .cbg{transition:stroke .12s}
.card:hover .cbg{stroke:var(--accent)!important}
.card.drop .cbg{stroke:var(--accent)!important;stroke-width:2.5px;stroke-dasharray:6 4}
.card.dragging{opacity:.82;cursor:grabbing}
.card.dragging .cbg{filter:drop-shadow(0 8px 14px rgba(0,0,0,.18))}
.tg{cursor:pointer}
.tg:hover rect{stroke:var(--accent)!important}

.float{position:absolute;display:flex;gap:4px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:4px;z-index:15;transform:translateX(-50%)}
.float button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;border-radius:7px;padding:6px 8px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.float button:hover{background:var(--accent-soft)}
.float svg{width:16px;height:16px}

.zoom{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:3px;z-index:10}
.zoom button{border:0;background:none;border-radius:7px;padding:6px;cursor:pointer;display:grid;place-items:center}
.zoom button:hover{background:var(--panel-2)}
.zoom output{font-family:var(--f-mono);font-size:12px;min-width:46px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);z-index:5;pointer-events:none}

.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;z-index:12;pointer-events:none}
.empty{pointer-events:auto;background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:26px 26px 22px;max-width:420px;width:100%;text-align:left}
.empty h2{font-family:var(--f-display);font-size:22px;margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
.empty p{margin:0 0 18px;color:var(--muted);line-height:1.5}
.empty .row{display:flex;gap:8px;flex-wrap:wrap}
.loading{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:10px}
.spin{width:16px;height:16px;border:2px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- painel ---------- */
.panel{background:var(--panel);border-left:1px solid var(--rule);overflow:auto;min-height:0;display:flex;flex-direction:column}
.p-inner{padding:18px max(18px,env(safe-area-inset-right,0px)) 24px 18px;display:flex;flex-direction:column;gap:18px}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet-close{display:none}
.photo-box{display:flex;gap:14px;align-items:center}
.ph{width:88px;height:88px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:30px;color:#fff;background-size:cover;background-position:center;position:relative;cursor:pointer;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--c,var(--accent))}
.ph.drag{box-shadow:0 0 0 3px var(--accent)}
.ph-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ph-actions small{color:var(--muted);font-size:12px;line-height:1.35}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.fl{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--rule);background:var(--panel-2);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;background:var(--panel)}
#f-name{font-family:var(--f-display);font-weight:600;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--rule);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.sw.auto{background:conic-gradient(#2f6db5 0 25%,#c2582b 0 50%,#2e8b6a 0 75%,#8a5cc2 0)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel-2);padding:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.team{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.team b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.danger-zone{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--rule);padding-top:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-mono);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.legend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;margin:0;font-size:13px;line-height:1.4}
.keys dt{white-space:nowrap}
.keys dd{margin:0;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--panel-2)}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}

/* ---------- modal e aviso ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,22,.45);display:grid;place-items:center;padding:16px;z-index:100}
.modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:560px;max-height:calc(100% - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0;font-family:var(--f-display);font-size:19px}
.modal p{margin:0;color:var(--muted);line-height:1.5}
.modal textarea{font-family:var(--f-mono);font-size:12.5px;min-height:170px;resize:vertical}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal img{max-width:100%;border:1px solid var(--rule);border-radius:8px;background:#fff}
.radio{display:flex;gap:16px;flex-wrap:wrap}
.radio label{display:flex;gap:6px;align-items:center;cursor:pointer}
code{font-family:var(--f-mono);font-size:12px;background:var(--panel-2);border:1px solid var(--rule);border-radius:4px;padding:1px 4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;z-index:120;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}

@media (max-width:760px){
  .main{grid-template-columns:minmax(0,1fr)}
  .panel{position:fixed;left:0;right:0;bottom:0;max-height:62%;border-left:0;border-top:1px solid var(--rule);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .22s ease;z-index:50;padding-bottom:env(safe-area-inset-bottom,0px)}
  .panel.open{transform:none}
  .sheet-close{display:inline-flex}
  .lbl{display:none}
  .hint{display:none}
  .search{flex:1 1 100%;order:5}
  #chartTitle{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg></div>
    <input id="chartTitle" aria-label="Título do organograma" value="Organograma" maxlength="80">
  </div>
  <div class="search">
    <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="Buscar pessoa, cargo ou área" aria-label="Buscar pessoa" autocomplete="off">
    <div class="results" id="results" hidden></div>
  </div>
  <div class="tools">
    <button class="btn icon" id="undo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="btn icon" id="redo" title="Refazer (Ctrl+Y)" aria-label="Refazer"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <span class="sep"></span>
    <button class="btn toggle" id="compact" aria-pressed="true" title="Empilha equipes sem subordinados em coluna, como no SmartDraw"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M12 7v13M12 11h2M12 16h2M12 13.5h-2M12 18.5h-2"/><rect x="14" y="9.5" width="7" height="3" rx="1"/><rect x="3" y="12" width="7" height="3" rx="1"/><rect x="14" y="14.5" width="7" height="3" rx="1"/><rect x="3" y="17" width="7" height="3" rx="1"/></svg><span class="lbl">Compacto</span></button>
    <div class="menu-wrap">
      <button class="btn" id="fileBtn" aria-haspopup="true" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/></svg><span class="lbl">Arquivo</span></button>
      <div class="menu" id="fileMenu" hidden role="menu">
        <div id="chartActs" hidden style="display:contents">
        <button role="menuitem" data-act="new"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Novo organograma</button>
        <button role="menuitem" data-act="dup"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>Duplicar este organograma</button>
        <button role="menuitem" class="del" data-act="delchart"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Excluir este organograma</button>
        <hr>
        </div>
        <button role="menuitem" data-act="png"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/></svg>Exportar imagem (PNG)</button>
        <button role="menuitem" data-act="json-out"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>Exportar backup (JSON)</button>
        <hr>
        <button role="menuitem" data-act="csv"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></svg>Importar planilha (Excel/CSV)</button>
        <button role="menuitem" data-act="json-in"><svg class="i" viewBox="0 0 24 24"><path d="M12 20V8M7 13l5-5 5 5M5 4h14"/></svg>Importar backup (JSON)</button>
        <hr>
        <button role="menuitem" data-act="clean" id="cleanBtn" hidden><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8M15 4l6 6"/></svg>Limpar fotos sem uso</button>
        <button role="menuitem" class="del" data-act="clear"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Apagar organograma</button>
      </div>
    </div>
    <span class="status" id="status" title=""><i></i><span>Conectando…</span></span>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Organogramas" hidden></nav>
</header>

<main class="main">
  <section class="stage" id="stage" aria-label="Prancheta do organograma">
    <svg id="chart" role="img" aria-label="Organograma">
      <defs>
        <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.3" style="fill:var(--dot)"/></pattern>
        <clipPath id="cclip"><rect width="248" height="96" rx="10"/></clipPath>
        <clipPath id="avclip"><circle cx="46" cy="48" r="29"/></clipPath>
      </defs>
      <rect width="100%" height="100%" fill="url(#dots)"/>
      <g id="vp"><path id="wires" style="fill:none;stroke:var(--wire);stroke-width:1.6px"/><g id="cards"></g></g>
    </svg>
    <div class="float" id="float" hidden>

<script>
(()=>{

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const twCache=new Map();

function ellip(s,font,max){if(tw(s,font)<=max)return s;while(s.length>1&&tw(s+'…',font)>max)s=s.slice(0,-1);return s.trimEnd()+'…'}
function wrap(text,font,max,maxLines){
  const w=String(text||'').trim().split(/\s+/).filter(Boolean),lines=[];let i=0;
  while(i<w.length&&lines.length<maxLines){
    let line=w[i++];
    while(i<w.length&&tw(line+' '+w[i],font)<=max)line+=' '+w[i++];
    if(lines.length===maxLines-1&&i<w.length){line+=' '+w.slice(i).join(' ');i=w.length}

}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

/* ---------------- estado ---------------- */
let nodes=new Map();
let meta={title:'Organograma',compact:true};
let sel=null, ready=false, mode='loading';
let view={x:0,y:0,k:1};

let db=null,col=null,metaRef=null,assets=null,downloads=null,fsPhotos=false;
let synced=new Map(), metaSynced=JSON.stringify(meta);
let hist=[],hi=-1;

function norm(d){d=d||{};return{
  parentId:String(d.parentId||''),ord:Number(d.ord)||0,
  name:String(d.name||'').slice(0,120),title:String(d.title||'').slice(0,160),dept:String(d.dept||'').slice(0,80),
  email:String(d.email||'').slice(0,160),phone:String(d.phone||'').slice(0,60),
  photo:okPhoto(d.photo)?String(d.photo):'',color:okColor(d.color)?d.color:'',

const ser=n=>JSON.stringify(norm(n));
function normMeta(d){d=d||{};return{title:String(d.title||'Organograma').slice(0,80),compact:d.compact!==false}}

function loadState(s){const o=typeof s==='string'?JSON.parse(s):s;meta=normMeta(o.meta||o);nodes=new Map();for(const p of (o.people||[])){if(!p||!p.id)continue;const id=String(p.id).replace(/[^\w-]/g,'').slice(0,40)||uid();nodes.set(id,{id,...norm(p)})}}

/* ---------------- layout ---------------- */
function kidsOf(id){return byParent.get(id)||[]}
function buildIndex(){
  byParent=new Map();
  for(const n of nodes.values()){
    let p=n.parentId;if(p&&(!nodes.has(p)||p===n.id))p='';
    if(!byParent.has(p))byParent.set(p,[]);byParent.get(p).push(n);
  }
  for(const a of byParent.values())a.sort((x,y)=>x.ord-y.ord||x.name.localeCompare(y.name));
}
function countDesc(id,seen=new Set()){let c=0;for(const k of kidsOf(id)){if(seen.has(k.id))continue;seen.add(k.id);c+=1+countDesc(k.id,seen)}return c}
const isLeafAsst=c=>c.kind==='assistant'&&kidsOf(c.id).length===0;
function leaf(n){n._kids=[];n._mode='';n._l=n._r=W/2;n._h=H;n._desc=n.collapsed?countDesc(n.id):0}
function measure(n,visited){
  visited.add(n.id);
  const all=kidsOf(n.id).filter(c=>!visited.has(c.id));
  n._desc=n.collapsed?countDesc(n.id):0;
  const open=!n.collapsed;
  const asst=open?all.filter(isLeafAsst):[];
  const staff=open?all.filter(c=>!isLeafAsst(c)):[];
  n._kids=[];n._mode='';let l=W/2,r=W/2,h=H;
  const ar=Math.ceil(asst.length/2);
  asst.forEach((a,i)=>{visited.add(a.id);leaf(a);n._kids.push({n:a,dx:(i%2?1:-1)*(AO+W/2),dy:H+28+Math.floor(i/2)*(H+AS),asst:true})});
  if(asst.length){l=Math.max(l,AO+W);if(asst.length>1)r=Math.max(r,AO+W);h=Math.max(h,H+28+ar*(H+AS)-AS)}
  const ablock=ar*(H+AS);
  if(staff.length){
    const leafy=meta.compact&&staff.length>=3&&staff.every(c=>c.collapsed||kidsOf(c.id).length===0);
    if(leafy){
      const top=H+34+ablock;
      staff.forEach((c,i)=>{visited.add(c.id);leaf(c);n._kids.push({n:c,dx:(i%2?1:-1)*(AO+W/2),dy:top+Math.floor(i/2)*(H+AS)})});
      l=Math.max(l,AO+W);r=Math.max(r,staff.length>1?AO+W:W/2);
      h=Math.max(h,top+Math.ceil(staff.length/2)*(H+AS)-AS+(staff[staff.length-1].collapsed?12:0));
      n._mode='stack';
    }else{
      const base=H+GY+ablock;
      const ms=staff.filter(c=>!visited.has(c.id)).map(c=>(measure(c,visited),c));
      if(!ms.length){n._l=l;n._r=r;n._h=h;return}
      const cs=[];let x=0;
      ms.forEach((c,i)=>{if(i>0)x+=ms[i-1]._r+GX+c._l;cs.push(x)});
      const mid=(cs[0]+cs[cs.length-1])/2;
      ms.forEach((c,i)=>{const dx=cs[i]-mid;n._kids.push({n:c,dx,dy:base});l=Math.max(l,-(dx-c._l));r=Math.max(r,dx+c._r);h=Math.max(h,base+c._h)});

    }

}
function place(n,cx,top){n._x=cx-W/2;n._y=top;for(const k of n._kids)place(k.n,cx+k.dx,top+k.dy)}
function layoutAll(){
  buildIndex();
  const visited=new Set();roots=[];
  for(const n of kidsOf(''))if(!visited.has(n.id)){measure(n,visited);roots.push(n)}
  for(const n of nodes.values())if(!visited.has(n.id)){measure(n,visited);roots.push(n)} // ciclos
  let x=0;roots.forEach((n,i)=>{if(i>0)x+=roots[i-1]._r+70+n._l;place(n,x,0)});
  const shown=visibleNodes();
  if(!shown.length){bounds={x0:0,y0:0,x1:0,y1:0};return}
  bounds={x0:Infinity,y0:Infinity,x1:-Infinity,y1:-Infinity};
  for(const n of shown){bounds.x0=Math.min(bounds.x0,n._x);bounds.y0=Math.min(bounds.y0,n._y);bounds.x1=Math.max(bounds.x1,n._x+W);bounds.y1=Math.max(bounds.y1,n._y+H+(n._desc?12:0))}
}
function visibleNodes(){const out=[];const walk=n=>{out.push(n);for(const k of n._kids)walk(k.n)};roots.forEach(walk);return out}
function wiresPath(list){
  let d='';const f=v=>Math.round(v*10)/10;
  for(const n of list){
    if(!n._kids.length)continue;
    const cx=n._x+W/2,by=n._y+H;let end=by;
    const side=[],tree=[];
    for(const k of n._kids)(k.asst||n._mode==='stack'?side:tree).push(k);
    for(const k of side){const my=k.n._y+H/2;end=Math.max(end,my);d+=`M${f(cx)} ${f(my)}H${f(k.dx<0?k.n._x+W:k.n._x)}`}

      const busY=tree[0].n._y-30;end=Math.max(end,busY);
      const xs=tree.map(k=>k.n._x+W/2);
      d+=`M${f(Math.min(...xs,cx))} ${f(busY)}H${f(Math.max(...xs,cx))}`;
      for(const k of tree)d+=`M${f(k.n._x+W/2)} ${f(busY)}V${f(k.n._y)}`;
    }

  }

}
function cardMarkup(n,C,F,photoSrc){
  const col=nodeColor(n),isSel=C.screen&&n.id===sel,cy=H/2;

  s+=`<rect class="cbg" width="${W}" height="${H}" rx="10" style="fill:${C.card};stroke:${C.edge};stroke-width:1px${n.kind==='assistant'?';stroke-dasharray:5 4':''}"/>`;

  const src=photoSrc!==undefined?photoSrc:photoURL(n.photo);

  if(src){s+=`<circle cx="46" cy="${cy}" r="29" style="fill:${C.card}"/><image href="${esc(src)}" xlink:href="${esc(src)}" x="17" y="${cy-29}" width="58" height="58" preserveAspectRatio="xMidYMid slice" clip-path="url(#avclip)"/>`}
  else s+=`<text x="46" y="${cy+7}" text-anchor="middle" style="font:${F.ini};fill:#ffffff">${esc(initials(n.name))}</text>`;
  const tx=88,mw=W-tx-12;
  const name=ellip(n.name||'Sem nome',F.name,mw);
  const tl=wrap(n.title,F.title,mw,2);
  s+=`<text x="${tx}" y="31" style="font:${F.name};fill:${C.ink}">${esc(name)}</text>`;
  tl.forEach((t,i)=>{s+=`<text x="${tx}" y="${50+i*15.5}" style="font:${F.title};fill:${C.muted}">${esc(t)}</text>`});
  if(n.dept){const dt=ellip(n.dept.toUpperCase(),F.dept,mw-12);s+=`<circle cx="${tx+3.5}" cy="${H-15.5}" r="3.5" style="fill:${col}"/><text x="${tx+12}" y="${H-12}" style="font:${F.dept};letter-spacing:.06em;fill:${C.muted}">${esc(dt)}</text>`}
  const hasKids=kidsOf(n.id).length>0;
  if(hasKids&&(C.screen||n.collapsed)){
    const lab=n.collapsed?'+'+(n._desc>999?'999':n._desc):'−';

  }
  s+='</g>';return s;
}

/* ---------------- render ---------------- */
const svg=$('#chart'),vp=$('#vp'),cardsG=$('#cards'),wiresEl=$('#wires'),stage=$('#stage');
function render(){
  layoutAll();
  const list=visibleNodes();
  wiresEl.setAttribute('d',wiresPath(list));
  cardsG.innerHTML=list.map(n=>cardMarkup(n,SCREEN_C,SCREEN_F)).join('');
  applyView();refreshPanel();updateOverlay();updateUndo();
}
function applyView(){
  vp.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.k})`);
  $('#dots').setAttribute('patternTransform',`translate(${view.x} ${view.y}) scale(${view.k})`);
  $('#zval').textContent=Math.round(view.k*100)+'%';
  positionFloat();
}
function positionFloat(){
  const f=$('#float');const n=sel&&nodes.get(sel);
  if(!n||n._x==null||!visibleNodes().includes(n)||act&&act.moved){f.hidden=true;return}
  f.hidden=false;
  const r=stage.getBoundingClientRect();
  let cx=(n._x+W/2)*view.k+view.x,top=n._y*view.k+view.y-f.offsetHeight-12;
  if(top<8)top=(n._y+H)*view.k+view.y+20;
  const half=f.offsetWidth/2;cx=clamp(cx,half+8,r.width-half-8);
  f.style.left=cx+'px';f.style.top=top+'px';
}
function updateOverlay(){
  $('#loading').hidden=ready;$('#empty').hidden=!ready||nodes.size>0;
  $('#overlay').hidden=ready&&nodes.size>0;
}
function stageSize(){const r=stage.getBoundingClientRect();return{w:r.width,h:r.height}}
function fit(){
  layoutAll();const{w,h}=stageSize();if(!nodes.size||!w)return applyView();
  const bw=bounds.x1-bounds.x0,bh=bounds.y1-bounds.y0;
  const k=clamp(Math.min((w-60)/bw,(h-90)/bh,1.05),.15,1.05);
  view.k=k;view.x=(w-bw*k)/2-bounds.x0*k;view.y=Math.max(40,(h-bh*k)/2)-bounds.y0*k;applyView();
}
function zoomAt(f,sx,sy){const{w,h}=stageSize();if(sx==null){sx=w/2;sy=h/2}
  const k=clamp(view.k*f,.12,2.5);const wx=(sx-view.x)/view.k,wy=(sy-view.y)/view.k;view.k=k;view.x=sx-wx*k;view.y=sy-wy*k;applyView()}
function centerOn(id){const n=nodes.get(id);if(!n||n._x==null)return;const{w,h}=stageSize();view.x=w/2-(n._x+W/2)*view.k;view.y=h/2.6-(n._y+H/2)*view.k;applyView()}
function ensureVisible(id){const n=nodes.get(id);if(!n||n._x==null)return;const{w,h}=stageSize();const sx=n._x*view.k+view.x,sy=n._y*view.k+view.y;
  if(sx<20||sy<70||sx+W*view.k>w-20||sy+H*view.k>h-30)centerOn(id)}

/* ---------------- histórico e gravação ---------------- */
function pushHist(){const s=snapshot();if(hist[hi]===s)return;hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>80)hist.shift();hi=hist.length-1}

function touch(){render();scheduleSave()}
function updateUndo(){$('#undo').disabled=hi<=0;$('#redo').disabled=hi>=hist.length-1}
function restore(s){loadState(s);if(sel&&!nodes.has(sel))sel=null;syncTitle();render();buildPanel();scheduleSave();if(mode==='db'&&chartId)renderTabs()}
function undo(){if(hi>0){hi--;restore(hist[hi])}}
function redo(){if(hi<hist.length-1){hi++;restore(hist[hi])}}

let saveTimer=null,saving=false,again=false,failCount=0;
function scheduleSave(){clearTimeout(saveTimer);if(mode==='db')setStatus('busy','Salvando…');saveTimer=setTimeout(save,mode==='db'?500:250)}
function setStatus(kind,text,tip){const s=$('#status');s.className='status '+(kind||'');s.querySelector('span').textContent=text;s.title=tip||''}
async function save(){
  if(mode==='local'){try{localStorage.setItem(LS_KEY,snapshot());setStatus('ok','Salvo neste navegador','Os dados ficam só neste navegador. Use Arquivo › Exportar backup para guardar uma cópia.')}catch(e){setStatus('err','Não foi possível salvar','O navegador bloqueou o armazenamento. Exporte um backup em Arquivo.')}return}

  if(saving){again=true;return savePromise}
  saving=true;
  return savePromise=(async()=>{try{
    do{
      again=false;const ops=[];
      for(const [id,n] of nodes){const js=ser(n);if(synced.get(id)!==js)ops.push({id,js,data:norm(n)})}
      for(const id of [...synced.keys()])if(!nodes.has(id))ops.push({id,del:true});
      const mjs=JSON.stringify(meta);
      if(mjs!==metaSynced){const prev=metaSynced;metaSynced=mjs;try{await (fsPhotos?metaRef.set(JSON.parse(mjs),{merge:true}):metaRef.set(JSON.parse(mjs)))}catch(e){metaSynced=prev;throw e}}
      let i=0,err=null;
      const worker=async()=>{while(i<ops.length&&!err){const op=ops[i++];const prev=synced.get(op.id);
        try{if(op.del){synced.delete(op.id);await col.doc(op.id).delete()}else{synced.set(op.id,op.js);await col.doc(op.id).set(op.data)}}
        catch(e){if(prev===undefined)synced.delete(op.id);else synced.set(op.id,prev);err=e}}};
      await Promise.all(Array.from({length:Math.min(5,ops.length)},worker));
      if(err)throw err;
    }while(again);

  }catch(e){
    const code=e&&e.code;
    if(code==='not_granted'||code==='revoked'||code==='permission-denied'){setStatus('err','Somente leitura','Você pode ver o organograma, mas não tem permissão para salvar alterações.')}
    else if(code==='quota_exceeded'){setStatus('err','Espaço esgotado','O armazenamento desta página está cheio. Remova fotos ou pessoas.')}
    else if(failCount<4){failCount++;setStatus('busy','Tentando salvar…');setTimeout(save,1500*failCount)}
    else setStatus('err','Não foi possível salvar',(e&&e.message)||'');
  }finally{saving=false}})();
}
let savePromise=null;
function onPeople(snap){
  let changed=false;
  for(const ch of snap.docChanges()){
    const id=ch.doc.id;
    if(ch.type==='removed'){
      if(!synced.has(id)&&!nodes.has(id))continue;
      const local=nodes.get(id);if(local&&ser(local)!==synced.get(id))continue;
      synced.delete(id);if(nodes.delete(id))changed=true;continue;
    }
    const d=norm(ch.doc.data()),js=JSON.stringify(d);
    if(synced.get(id)===js&&nodes.has(id))continue;
    const local=nodes.get(id);
    if(local&&synced.has(id)&&ser(local)!==synced.get(id))continue; // edição local pendente vence
    nodes.set(id,{id,...d});synced.set(id,js);changed=true;
  }
  if(!ready){ready=true;hist=[];hi=-1;pushHist();render();fit();setStatus('ok','Salvo','Alterações salvas e visíveis para quem tem acesso a esta página.');return}
  if(changed){if(sel&&!nodes.has(sel)){sel=null;buildPanel()}render()}
}
function onMeta(s){
  if(!s.exists)return;

  if(js===metaSynced)return;
  if(JSON.stringify(meta)!==metaSynced)return;
  meta=d;metaSynced=js;syncTitle();if(ready)render();if(mode==='db'&&chartId)renderTabs();
}

function initFirebase(){
  if(!window.firebase){startLocal();setStatus('err','Firebase não carregou','Sem internet ou bloqueio de rede. Os dados estão sendo salvos só neste navegador.');return}
  try{
    const app=firebase.apps.length?firebase.app():firebase.initializeApp(FIREBASE_CONFIG);
    db=app.firestore();fsPhotos=true;mode='db';
    $('#cleanBtn').hidden=false;$('#chartActs').hidden=false;$('#tabs').hidden=false;
    let migrating=false;
    db.collection('charts').onSnapshot(async snap=>{
      charts=snap.docs.map(d=>{const x=d.data()||{};return{id:d.id,title:String(x.title||'Organograma'),order:Number(x.order)||0,createdAt:Number(x.createdAt)||0}})
        .sort((a,b)=>a.order-b.order||a.createdAt-b.createdAt);
      if(!charts.length){
        if(migrating)return;migrating=true;
        try{await migrateLegacy()}catch(e){failInit(e)}
        return;
      }
      renderTabs();
      if(!chartId||!charts.some(c=>c.id===chartId)){
        let want=decodeURIComponent(location.hash.slice(1));
        if(!charts.some(c=>c.id===want)){try{want=localStorage.getItem(LS_KEY+'-ultimo')}catch(e){want=''}}
        openChart(charts.some(c=>c.id===want)?want:charts[0].id);
      }
    },failInit);
  }catch(e){startLocal();setStatus('err','Erro no Firebase',e&&e.message)}
}
function failInit(e){
  if(!ready&&mode==='db'){$('#tabs').hidden=true;$('#chartActs').hidden=true;$('#cleanBtn').hidden=true;fsPhotos=false;startLocal();setStatus('err','Sem acesso ao Firebase',(e&&e.message)||'Confira as regras do Firestore.');toast('Não consegui ler o Firebase. Confira as regras de segurança do Firestore.');return}
  setStatus('err','Sem conexão',e&&e.message);

/* Primeiro acesso com abas: o organograma antigo (coleções people e meta) vira a aba "principal". */
async function migrateLegacy(){
  const cid='principal';
  const [legacy,m]=await Promise.all([db.collection('people').get(),db.doc('meta/chart').get()]);
  const md=m.exists?normMeta(m.data()):{title:'Organograma',compact:true};
  const docs=legacy.docs;
  for(let i=0;i<docs.length;i+=400){
    const b=db.batch();
    docs.slice(i,i+400).forEach(d=>b.set(db.collection('charts').doc(cid).collection('people').doc(d.id),norm(d.data())));
    await b.commit();
  }
  await db.collection('charts').doc(cid).set({...md,order:0,createdAt:Date.now()},{merge:true});
}

function maxOrd(pid){const k=kidsOf(pid);return k.length?Math.max(...k.map(c=>c.ord)):0}
function isDesc(ancestor,id){let cur=nodes.get(id),g=0;while(cur&&cur.parentId&&g++<5000){if(cur.parentId===ancestor)return true;cur=nodes.get(cur.parentId)}return false}
function newPerson(pid,extra){buildIndex();const id=uid();const p=pid?nodes.get(pid):null;
  nodes.set(id,{id,...norm({parentId:pid||'',ord:maxOrd(pid||'')+1,name:'Novo colaborador',title:'Cargo',dept:p&&p.kind!=='assistant'?p.dept:(p?p.dept:''),...extra})});return id}
function addChild(pid,kind){const p=nodes.get(pid);if(p&&p.collapsed)p.collapsed=false;const id=newPerson(pid,{kind:kind||'staff'});sel=id;commit();buildPanel(true);ensureVisible(id);focusName()}
function addSibling(id){const n=nodes.get(id);if(!n)return;buildIndex();
  const sib=kidsOf(n.parentId),i=sib.indexOf(n),next=sib[i+1];
  const nid=newPerson(n.parentId,{ord:next?(n.ord+next.ord)/2:n.ord+1,dept:n.dept,kind:n.kind});sel=nid;commit();buildPanel(true);ensureVisible(nid);focusName()}
function reparent(id,pid){if(!id||id===pid)return false;if(pid&&isDesc(id,pid))return false;
  const n=nodes.get(id);if(!n)return false;buildIndex();
  n.parentId=pid||'';n.ord=maxOrd(pid||'')+1;const p=pid&&nodes.get(pid);if(p&&p.collapsed)p.collapsed=false;commit();return true}
function removePerson(id,withTeam){
  const n=nodes.get(id);if(!n)return;buildIndex();let count=1;
  if(withTeam){const stack=[id];while(stack.length){const c=stack.pop();for(const k of kidsOf(c)){stack.push(k.id)}if(c!==id)count++;nodes.delete(c)}}
  else{kidsOf(id).forEach((k,i)=>{k.parentId=n.parentId;k.ord=n.ord+(i+1)/(kidsOf(id).length+1)});nodes.delete(id)}
  sel=n.parentId&&nodes.has(n.parentId)?n.parentId:null;commit();buildPanel();
  toast(count>1?`${count} pessoas excluídas.`:`${n.name||'Pessoa'} excluído(a) do organograma.`,'Desfazer',undo);
}
function toggleCollapse(id){const n=nodes.get(id);if(!n)return;n.collapsed=!n.collapsed;commit()}
function select(id){sel=id;render();buildPanel(true);
  if(id&&window.innerWidth<=760){const n=nodes.get(id);if(n&&n._x!=null){const{w,h}=stageSize();view.k=Math.max(view.k,.6);view.x=w/2-(n._x+W/2)*view.k;view.y=h*.22-(n._y+H/2)*view.k;applyView()}}}
function reveal(id){let n=nodes.get(id),g=0;while(n&&n.parentId&&g++<5000){const p=nodes.get(n.parentId);if(p&&p.collapsed){p.collapsed=false}n=p}touch();sel=id;render();buildPanel(true);centerOn(id)}

/* ---------------- fotos ---------------- */
/* No Firebase gratuito (sem Storage), cada foto é guardada inteira, sem redução, no Firestore:
   fotos/{id} guarda tipo e tamanho; fotos/{id}/partes/{0000..} guarda o arquivo em pedaços de ~900 KB. */
const CHUNK=900000;
const photoCache=new Map(),photoProm=new Map();
let rqRender=0;
function scheduleRender(){if(rqRender)return;rqRender=requestAnimationFrame(()=>{rqRender=0;if(ready)render()})}
function photoURL(p){
  if(!okPhoto(p))return '';
  if(!p.startsWith('fs:'))return p;
  const pid=p.slice(3);
  if(photoCache.has(pid))return photoCache.get(pid);
  loadFsPhoto(pid).catch(()=>{});return '';
}
function loadFsPhoto(pid){
  if(photoProm.has(pid))return photoProm.get(pid);
  const pr=(async()=>{
    if(!db||!fsPhotos)throw new Error('sem banco');
    const ref=db.collection('fotos').doc(pid);
    const m=await ref.get();if(!m.exists)throw new Error('foto não encontrada');
    const md=m.data()||{};
    const parts=await ref.collection('partes').get();
    const b64=parts.docs.slice().sort((a,b)=>a.id.localeCompare(b.id)).map(d=>(d.data()||{}).d||'').join('');
    const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u8],{type:md.type||'image/jpeg'}));
    photoCache.set(pid,url);return url;
  })();
  photoProm.set(pid,pr);
  pr.then(scheduleRender,()=>{photoCache.set(pid,'')});
  return pr;
}
async function uploadFsPhoto(blob,showProgress){
  const pid=uid();
  const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=rej;fr.readAsDataURL(blob)});
  const n=Math.max(1,Math.ceil(b64.length/CHUNK));
  const ref=db.collection('fotos').doc(pid);
  for(let i=0;i<n;i++){
    if(showProgress)toast(`Enviando foto… ${Math.round(i/n*100)}%`);
    await ref.collection('partes').doc(String(i).padStart(4,'0')).set({d:b64.slice(i*CHUNK,(i+1)*CHUNK)});
  }
  await ref.set({type:blob.type||'image/jpeg',name:String(blob.name||'').slice(0,120),size:blob.size,parts:n,createdAt:Date.now()});
  const url=URL.createObjectURL(blob);photoCache.set(pid,url);photoProm.set(pid,Promise.resolve(url));
  return 'fs:'+pid;
}
async function convertDataPhotos(){
  const list=[...nodes.values()].filter(n=>n.photo&&n.photo.startsWith('data:'));
  for(let i=0;i<list.length;i++){toast(`Salvando fotos do backup… ${i+1} de ${list.length}`);
    try{const b=await (await fetch(list[i].photo)).blob();list[i].photo=await uploadFsPhoto(b,false)}catch(e){list[i].photo=''}}
}
async function cleanPhotos(){
  if(!fsPhotos)return;
  toast('Procurando fotos sem uso…');
  const used=new Set();
  const addFrom=arr=>arr.forEach(n=>{if(n.photo&&n.photo.startsWith('fs:'))used.add(n.photo.slice(3))});
  addFrom([...nodes.values()]);for(const h of hist){try{addFrom(JSON.parse(h).people||[])}catch(e){}}
  try{
    const lists=await Promise.all([db.collection('people').get(),...charts.filter(c=>c.id!==chartId).map(c=>db.collection('charts').doc(c.id).collection('people').get())]);
    for(const l of lists)addFrom(l.docs.map(d=>d.data()||{}));
  }catch(e){toast('Não consegui conferir as fotos dos outros organogramas.');return}
  let snap;try{snap=await db.collection('fotos').get()}catch(e){toast('Não consegui listar as fotos.');return}
  const orphan=snap.docs.filter(d=>!used.has(d.id));
  const mb=orphan.reduce((a,d)=>a+((d.data()||{}).size||0),0)/1048576;
  const total=snap.docs.reduce((a,d)=>a+((d.data()||{}).size||0),0)/1048576;
  $('#toastRoot').innerHTML='';
  if(!orphan.length){const bg=modal(`<h3>Nenhuma foto sem uso</h3><p>Todas as ${snap.size} fotos guardadas estão em algum cartão. Espaço usado: ${total.toFixed(1)} MB de 1024 MB do plano gratuito.</p><div class="actions"><button class="btn primary" data-x>Fechar</button></div>`);bg.querySelector('[data-x]').onclick=closeModal;return}
  const bg=modal(`<h3>Apagar fotos sem uso?</h3><p>Há ${orphan.length} foto(s) trocadas ou removidas ocupando ${mb.toFixed(1)} MB. Fotos usadas no organograma não são tocadas. Espaço total usado por fotos: ${total.toFixed(1)} MB.</p><div class="actions"><button class="btn" data-x>Cancelar</button><button class="btn danger armed" data-ok>Apagar ${orphan.length} foto(s)</button></div>`);
  bg.querySelector('[data-x]').onclick=closeModal;
  bg.querySelector('[data-ok]').onclick=async()=>{closeModal();let done=0;
    for(const d of orphan){try{const parts=await d.ref.collection('partes').get();for(const p of parts.docs)await p.ref.delete();await d.ref.delete();done++;toast(`Apagando fotos… ${done} de ${orphan.length}`)}catch(e){}}
    toast(`${done} foto(s) sem uso apagadas.`)};
}
let photoTarget=null;
async function fileToSquare(file,size){
  const url=URL.createObjectURL(file);
  try{const img=new Image();img.src=url;await img.decode();
    const s=Math.min(img.naturalWidth,img.naturalHeight);const c=document.createElement('canvas');c.width=c.height=size;
    const x=c.getContext('2d');x.imageSmoothingQuality='high';
    x.drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2.4,s,s,0,0,size,size);return c}
  finally{URL.revokeObjectURL(url)}
}
async function setPhoto(id,file){
  if(!file||!/^image\//.test(file.type)){toast('Escolha um arquivo de imagem (JPG ou PNG).');return}
  const n=nodes.get(id);if(!n)return;
  try{
    let src='';
    if(fsPhotos){
      try{src=await uploadFsPhoto(file,true);toast('Foto salva.')}
      catch(e){toast('Não consegui salvar a foto no Firebase. '+((e&&e.code)==='permission-denied'?'Confira as regras do Firestore.':'Tente de novo.'));return}
    }
    else if(assets){try{const c=await fileToSquare(file,360);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.86));const r=await assets.upload(blob,{type:'image/jpeg'});if(okPhoto(r.url))src=r.url}catch(e){}}
    if(!src){const c=await fileToSquare(file,180);src=c.toDataURL('image/jpeg',.82)}
    const m=nodes.get(id);if(!m)return;m.photo=src;commit();buildPanel(true);
  }catch(e){toast('Não consegui ler essa imagem. Tente outro arquivo.')}
}

function parseCSV(text){
  text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';
  const delim=['\t',';',','].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],f='',qt=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(qt){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else qt=false}else f+=c}
    else if(c==='"'&&f==='')qt=true;
    else if(c===delim){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(Boolean));
}
const HEAD={name:['nome','name','colaborador','funcionario','pessoa','nome completo'],title:['cargo','funcao','title','posicao'],dept:['area','departamento','setor','depto','department'],mgr:['gestor','superior','chefe','lider','responsavel','reporta a','gestor imediato','manager'],email:['email','e-mail'],phone:['telefone','ramal','fone','celular','phone'],kind:['assistente','tipo']};
function importRows(rows,replace){
  if(!rows.length)return 0;
  const h=rows[0].map(key);const idx={};
  for(const[f,names]of Object.entries(HEAD)){const i=h.findIndex(x=>names.includes(x));if(i>=0)idx[f]=i}
  let body=rows;
  if(idx.name!=null)body=rows.slice(1);else{idx.name=0;idx.title=1;idx.dept=2;idx.mgr=3}
  if(replace)nodes=new Map();
  const byName=new Map();for(const n of nodes.values())byName.set(key(n.name),n.id);
  const made=[];
  body.forEach((r,i)=>{const name=r[idx.name];if(!name)return;const id=uid()+i;
    const kindRaw=idx.kind!=null?key(r[idx.kind]):'';
    nodes.set(id,{id,...norm({name,title:r[idx.title]||'',dept:r[idx.dept]||'',email:idx.email!=null?r[idx.email]:'',phone:idx.phone!=null?r[idx.phone]:'',ord:i,kind:/assist|^sim$|^x$/.test(kindRaw)?'assistant':'staff'})});
    byName.set(key(name),id);made.push([id,idx.mgr!=null?r[idx.mgr]:'']);
  });
  for(const[id,m]of made){const pid=m?byName.get(key(m)):null;if(pid&&pid!==id&&!isDesc(id,pid))nodes.get(id).parentId=pid}
  return made.length;
}

async function toDataURL(src,size){
  try{
    if(src.startsWith('fs:')){src=await loadFsPhoto(src.slice(3));if(!src)throw 0}
    let b;if(src.startsWith('data:')){if(!size)return src;b=await (await fetch(src)).blob()}
    else{const r=await fetch(src,{mode:'cors'});if(!r.ok)throw 0;b=await r.blob()}
    if(!size)return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res('');fr.readAsDataURL(b)});
    const c=await fileToSquare(b,size);return c.toDataURL('image/jpeg',.9);
  }catch(e){exportPhotoFail++;return ''}}
function saveFile(name,blob){const a=document.createElement('a');const u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function buildExportSVG(){
  layoutAll();const list=visibleNodes();
  const pad=48,head=78;const bw=bounds.x1-bounds.x0,bh=bounds.y1-bounds.y0;
  const w=Math.max(Math.ceil(bw+pad*2),520),h=Math.ceil(bh+pad*2+head);
  const ox=(w-bw)/2-bounds.x0,oy=pad+head-bounds.y0;
  const photos=new Map();await Promise.all(list.filter(n=>okPhoto(n.photo)).map(async n=>photos.set(n.id,await toDataURL(n.photo,240))));
  const C=EXPORT_C,F=EXPORT_F;
  const date=new Date().toLocaleDateString('pt-BR');
  const body=list.map(n=>cardMarkup(n,C,F,photos.get(n.id)||'')).join('');
  return{w,h,svg:`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
<defs><clipPath id="cclip"><rect width="${W}" height="${H}" rx="10"/></clipPath><clipPath id="avclip"><circle cx="46" cy="${H/2}" r="29"/></clipPath></defs>
<rect width="100%" height="100%" style="fill:${C.paper}"/>
<text x="${pad}" y="${pad+8}" style="font:bold 24px Arial, Helvetica, sans-serif;fill:${C.ink}">${esc(meta.title)}</text>
<text x="${pad}" y="${pad+32}" style="font:13px Arial, Helvetica, sans-serif;fill:${C.muted}">${nodes.size} pessoas · atualizado em ${date}</text>
<g transform="translate(${ox} ${oy})"><path d="${wiresPath(list)}" style="fill:none;stroke:${C.wire};stroke-width:1.6px"/>${body}</g></svg>`};
}
async function exportPNG(){
  if(!nodes.size){toast('O organograma está vazio.');return}
  toast('Gerando imagem…');
  try{
    const{w,h,svg:s}=await buildExportSVG();
    const scale=clamp(Math.min(2,9000/w,9000/h),.5,2);
    const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);await img.decode();
    const c=document.createElement('canvas');c.width=Math.round(w*scale);c.height=Math.round(h*scale);
    const x=c.getContext('2d');x.scale(scale,scale);x.drawImage(img,0,0);
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    const fname=(key(meta.title).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'organograma')+'.png';
    const pf=exportPhotoFail;exportPhotoFail=0;
    if(!window.claude){saveFile(fname,blob);toast(pf?'Imagem baixada, mas algumas fotos não carregaram.':'Imagem baixada.');return}
    if(downloads){try{await downloads.save({filename:fname,data:blob});toast('Imagem pronta.');return}catch(e){if(e&&e.code==='declined'){toast('Download cancelado.');return}}}
    const url=c.toDataURL('image/png');
    const bg=modal(`<h3>Imagem do organograma</h3><p>Clique com o botão direito na imagem e escolha “Salvar imagem como…”. No celular, toque e segure.</p><img alt="Organograma exportado" src="${url}"><div class="actions"><button class="btn primary" data-x>Fechar</button></div>`);
    bg.querySelector('[data-x]').onclick=closeModal;$('#toastRoot').innerHTML='';
  }catch(e){toast('Não consegui gerar a imagem. Tente remover fotos muito grandes.')}
}
async function exportJSON(){
  const people=await Promise.all([...nodes.values()].map(async n=>{const o={id:n.id,...norm(n)};if(o.photo&&(o.photo.startsWith('/')||o.photo.startsWith('fs:')))o.photo=await toDataURL(o.photo);return o}));
  const txt=JSON.stringify({title:meta.title,compact:meta.compact,exportedAt:new Date().toISOString(),people},null,1);
  const fname=(key(meta.title).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'organograma')+'-backup.json';
  if(!window.claude){saveFile(fname,new Blob([txt],{type:'application/json'}));toast('Backup baixado.');return}
  if(downloads){try{await downloads.save({filename:fname,data:new Blob([txt],{type:'application/json'})});toast('Backup salvo.');return}catch(e){if(e&&e.code==='declined'){toast('Download cancelado.');return}}}
  const bg=modal(`<h3>Backup do organograma</h3><p>Copie o texto e salve num arquivo <code>.json</code>. Depois use Arquivo › Importar backup para restaurar.</p><div class="field"><label for="jsonOut">Conteúdo</label><textarea id="jsonOut" readonly></textarea></div><div class="actions"><button class="btn" data-x>Fechar</button><button class="btn primary" data-copy>Copiar</button></div>`);
  const ta=bg.querySelector('#jsonOut');ta.value=txt;
  bg.querySelector('[data-x]').onclick=closeModal;
  bg.querySelector('[data-copy]').onclick=()=>{navigator.clipboard?.writeText(txt).then(()=>toast('Copiado.'),()=>{ta.select();toast('Selecionado. Use Ctrl+C para copiar.')})||(ta.select())};
}

/* ---------------- início ---------------- */
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{twCache.clear();if(ready)render()});
init();
})();
